
name: Generar APK Querida Hola

on:
  workflow_dispatch:
  push:
    paths:
      - 'index.html'
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android
        uses: android-actions/setup-android@v3

      - name: Instalar herramientas
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Crear proyecto Android
        run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/index.html
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "QueridaHola"
          include ':app'
          EOF
          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.6.1' apply false
          }
          EOF
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.example.queridahola'
              compileSdk 35
              defaultConfig {
                  applicationId 'com.example.queridahola'
                  minSdk 23
                  targetSdk 28
                  versionCode 1
                  versionName '1.0'
              }
          }
          EOF
          mkdir -p app/src/main/java/com/example/queridahola
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:theme="@android:style/Theme.Material.Light.NoActionBar" android:label="Querida Hola">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          cat > app/src/main/java/com/example/queridahola/MainActivity.java <<'EOF'
          package com.example.queridahola;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.view.View;
          public class MainActivity extends Activity {
              public void onCreate(Bundle b) {
                  super.onCreate(b);
                  WebView w = new WebView(this);
                  w.setWebViewClient(new WebViewClient());
                  w.getSettings().setJavaScriptEnabled(true);
                  setContentView(w);
                  w.loadUrl("file:///android_asset/index.html");
              }
          }
          EOF

      - name: Compilar APK
        run: gradle --no-daemon assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: QueridaHola-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
